<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>回転サイト</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="tutorial-open">
<section id="tutorial" class="tutorial" aria-label="使い方説明">
  <div class="tutorial-page active" data-step="0">
    <div class="tutorial-frame" data-native-w="1856" data-native-h="1558">
      <img class="tutorial-full" src="assets/tutorial_1.webp" alt="使い方1">
      <img class="tutorial-button-art" src="assets/tutorial_btn_1.png" alt="" aria-hidden="true">
      <button class="tutorial-hotspot tutorial-next" type="button" aria-label="次へ"></button>
    </div>
  </div>
  <div class="tutorial-page" data-step="1">
    <div class="tutorial-frame" data-native-w="2021" data-native-h="1558">
      <img class="tutorial-full" src="assets/tutorial_2.webp" alt="使い方2">
      <img class="tutorial-button-art" src="assets/tutorial_btn_2.png" alt="" aria-hidden="true">
      <button class="tutorial-hotspot tutorial-next" type="button" aria-label="次へ"></button>
    </div>
  </div>
  <div class="tutorial-page" data-step="2">
    <div class="tutorial-frame" data-native-w="1860" data-native-h="1558">
      <img class="tutorial-full" src="assets/tutorial_3.webp" alt="使い方3">
      <img class="tutorial-button-art" src="assets/tutorial_btn_3.png" alt="" aria-hidden="true">
      <button id="tutorialStart" class="tutorial-hotspot tutorial-start" type="button" aria-label="スタート"></button>
    </div>
  </div>
</section>
<main id="scene">
  <section id="orderTray" class="order-tray" aria-label="注文トレー">
    <div id="orderSlots" class="order-slots">
      <div class="empty-order">商品をクリックしてカートに追加</div>
    </div>
    <button id="orderButton" class="order-button" type="button" aria-label="注文する">
      <img src="assets/order_button.webp" alt="注文">
    </button>
  </section>
  <img id="background" src="assets/background.webp" alt="">
  <img class="curtain-logo curtain-logo-left" src="assets/shop_logo.png" alt="回転商店">
  <img class="curtain-logo curtain-logo-right" src="assets/shop_logo.png" alt="回転商店">
  <section id="backLane" class="lane back">
    <div class="belt-strip"></div>
    <div class="products"></div>
  </section>
  <section id="frontLane" class="lane front">
    <div class="belt-strip"></div>
    <div class="products"></div>
  </section>
</main>

<button id="bgmToggle" class="bgm-toggle" type="button" aria-label="BGMをオフにする" aria-pressed="true">
  <span class="bgm-toggle-icon">♪</span>
  <span class="bgm-toggle-label">ON</span>
</button>

<audio id="shopBgm" src="assets/bgm_washoku.mp3" loop preload="auto"></audio>
<script src="app.js"></script><script>
(() => {
  // All supplied tutorial PNGs have their NEXT/START button centered at
  // approximately (931, 1461) in image coordinates.  Align that point,
  // not the full PNG bounds.  This keeps page 2 stable even though its
  // white return arrow extends farther to the right.
  const BUTTON_X = 931;
  const BUTTON_Y = 1461;
  const NATIVE_H = 1558;

  function layoutTutorial(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Match the PowerPoint reference: generous red margin around the artwork.
    // Same scale on all three pages.
    const maxNativeW = 2021;
    const scale = Math.min((vh * 0.76) / NATIVE_H, (vw * 0.88) / maxNativeW);

    // Keep NEXT / START at exactly the same screen position on every page.
    const anchorX = vw * 0.50;
    const anchorY = vh * 0.85;

    document.querySelectorAll('.tutorial-frame').forEach(frame => {
      const nw = Number(frame.dataset.nativeW);
      const nh = Number(frame.dataset.nativeH);
      frame.style.width = `${nw * scale}px`;
      frame.style.height = `${nh * scale}px`;
      frame.style.left = `${anchorX - BUTTON_X * scale}px`;
      frame.style.top = `${anchorY - BUTTON_Y * scale}px`;
      frame.style.setProperty('--tutorial-scale', scale);
    });
  }
  window.addEventListener('resize', layoutTutorial);
  document.addEventListener('DOMContentLoaded', layoutTutorial);
  layoutTutorial();
})();
</script><script>(()=>{const t=document.getElementById('tutorial'),p=[...t.querySelectorAll('.tutorial-page')];let i=0;const show=n=>{i=n;p.forEach((x,j)=>x.classList.toggle('active',j===n))};t.querySelectorAll('.tutorial-next:not(.tutorial-start)').forEach(b=>b.onclick=()=>show(Math.min(i+1,p.length-1)));document.getElementById('tutorialStart').onclick=()=>{const bgm=document.getElementById('shopBgm');if(bgm){bgm.currentTime=0;bgm.volume=.275;bgm.play().catch(()=>{});}const bt=document.getElementById('bgmToggle');if(bt)bt.classList.add('is-visible');t.classList.add('leaving');document.body.classList.remove('tutorial-open');setTimeout(()=>t.remove(),360)}})();</script>

<script>
(() => {
  const bgm = document.getElementById('shopBgm');
  const btn = document.getElementById('bgmToggle');
  if (!bgm || !btn) return;

  const label = btn.querySelector('.bgm-toggle-label');

  function render() {
    const on = !bgm.muted;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? 'BGMをオフにする' : 'BGMをオンにする');
    if (label) label.textContent = on ? 'ON' : 'OFF';
    btn.classList.toggle('is-off', !on);
  }

  btn.addEventListener('click', () => {
    bgm.muted = !bgm.muted;
    if (!bgm.muted && bgm.paused) bgm.play().catch(() => {});
    render();
  });

  render();
})();
</script>

</body>
</html>
